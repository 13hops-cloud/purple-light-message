<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Purple Light Message Submit</title>
  <style>
    :root {
      --purple-light: #a366ff;
      --purple-main: #8000ff;
      --purple-dark: #4b0082;
      --white: #fff;
    }
    body {
      background: linear-gradient(120deg, var(--purple-light), var(--purple-main));
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      color: var(--white);
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(128,0,255,0.18);
    }
    h2 {
      color: var(--white);
      text-shadow: 0 2px 10px var(--purple-dark);
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid var(--purple-dark);
      background: var(--purple-light);
      color: var(--purple-dark);
      margin-bottom: 8px;
      box-sizing: border-box;
      resize: vertical;
      transition: background 0.2s, color 0.2s;
    }
    textarea:focus {
      background: var(--white);
      color: var(--purple-main);
      border: 2px solid var(--purple-main);
      outline: none;
    }
    button {
      background: var(--purple-light);
      color: var(--white);
      border: none;
      padding: 10px 32px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 2px 10px rgba(128,0,255,0.12);
      transition: background 0.25s;
    }
    button:hover {
      background: var(--purple-main);
    }
    @media (max-width: 640px) {
      body {
        max-width: 95vw;
        margin: 10vw 2vw;
      }
    }
  </style>
</head>
<body>

  <h2>Send a message</h2>
  <textarea id="msgBox" placeholder="Type something..."></textarea>
  <br>
  <button onclick="send()">Submit</button>

  <script>
    async function send() {
      const message = document.getElementById("msgBox").value;

      if (!message.trim()) {
        alert("Message cannot be empty.");
        return;
      }

      const webhookURL = "https://discord.com/api/webhooks/1421458219913445527/wIH2q6Dp9mgD9WymHLweyDzh212OWY8Pyj34v3UKyR88SRho9B3okKyZ-pfIFUVQpN_Z"; // Replace this

      const payload = {
        content: message
      };

      try {
        const res = await fetch(webhookURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert("Message sent!");
          document.getElementById("msgBox").value = "";
        } else {
          alert("Error sending message.");
        }
      } catch (e) {
        alert("Failed to send.");
      }
    }
  </script>

</body>
</html>
